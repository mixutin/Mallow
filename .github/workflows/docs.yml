# SPDX-License-Identifier: 0BSD
#
# Documentation site: https://mixutin.github.io/Mallow/
#
# - Pull requests: build the site with `mkdocs build --strict` (broken links,
#   missing anchors, pages missing from the nav and unknown devlog authors fail).
# - Pushes to main: build, then publish to GitHub Pages.
#
# One-time repository setting: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions".
#
# GitHub Pages serves ONE artifact per site. When catalog.yml (DESIGN.md §7.5)
# starts publishing catalog/v1/ to Pages, it must add its files to this
# workflow's artifact (for example by copying the signed catalog into
# site/catalog/v1/ before the upload step) instead of deploying separately,
# otherwise each deployment replaces the other.

name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "*.md" # root-level Markdown can be embedded in pages with snippets
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "*.md" # root-level Markdown can be embedded in pages with snippets
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: docs-build-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      # Silences Material for MkDocs' banner about MkDocs 2.0; it is not a build warning.
      NO_MKDOCS_2_WARNING: "true"
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install the docs toolchain
        run: python -m pip install -r requirements-docs.txt

      - name: Build the site
        run: mkdocs build --strict --site-dir site

      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
