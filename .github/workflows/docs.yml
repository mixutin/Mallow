# SPDX-License-Identifier: 0BSD
# Both languages are built into one Pages artifact. Future catalogs must join this artifact.
name: Docs
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "docs-fi/**"
      - "overrides/**"
      - "mkdocs*.yml"
      - "requirements-docs.txt"
      - "*.md"
      - "scripts/build-docs.sh"
      - "scripts/check-site.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "docs-fi/**"
      - "overrides/**"
      - "mkdocs*.yml"
      - "requirements-docs.txt"
      - "*.md"
      - "scripts/build-docs.sh"
      - "scripts/check-site.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build (strict, English and Finnish)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: docs-build-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      NO_MKDOCS_2_WARNING: "true"
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install the docs toolchain
        run: python -m pip install -r requirements-docs.txt
      - name: Build both languages and validate generated pages
        run: scripts/build-docs.sh
      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
