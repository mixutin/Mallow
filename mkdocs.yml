# SPDX-License-Identifier: 0BSD
# Documentation site for Mallow. Versions are pinned in requirements-docs.txt.
# Preview with mkdocs serve; CI builds with mkdocs build --strict.
site_name: Mallow
site_description: >-
  Mallow development previews for Apple Silicon. Test native onboarding and
  verified dependency acquisition; Windows launching is not implemented yet.
site_author: Mixutin and the Mallow contributors
site_url: https://mixutin.github.io/Mallow/
repo_name: mixutin/Mallow
repo_url: https://github.com/mixutin/Mallow
edit_uri: edit/main/docs/
copyright: >-
  Copyright &copy; 2026 Mixutin and the Mallow contributors ·
  <a href="https://github.com/mixutin/Mallow/blob/main/LICENSE">0BSD</a> ·
  Not affiliated with CodeWeavers, Apple, Microsoft or Valve.
docs_dir: docs

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
  font: false
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - content.action.view
    - toc.follow

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Development previews: development-preview.md
  - How it works: how-it-works.md
  - Devlog:
      - blog/index.md
  - Roadmap: roadmap.md
  - Design:
      - Architecture (DESIGN.md): DESIGN.md
      - Bootstrap addendum: BOOTSTRAP.md
      - Security model: SECURITY_MODEL.md
  - Contributing:
      - contributing/index.md
      - Development setup: contributing/dev-setup.md
      - Architecture tour: contributing/architecture-tour.md
      - Writing docs and devlog posts: contributing/writing-docs.md
  - FAQ: faq.md
  - Legal & licensing: legal.md

plugins:
  - search:
      lang: en
  - blog:
      blog_dir: blog
      blog_toc: true
      post_date_format: long
      post_url_format: "{date}/{slug}"
      post_url_date_format: yyyy/MM/dd
      post_readtime: true
      post_excerpt: optional
      post_excerpt_separator: <!-- more -->
      archive: true
      archive_name: Archive
      archive_date_format: yyyy
      archive_url_format: archive/{date}
      categories: true
      categories_name: Categories
      categories_url_format: category/{slug}
      authors: true
      authors_file: "{blog}/.authors.yml"
      pagination: true
      pagination_per_page: 10
      draft: false
      draft_on_serve: true
      draft_if_future_date: true
  - rss:
      match_path: blog/posts/.*
      use_git: false
      date_from_meta:
        as_creation: date
        as_update: date
        default_timezone: UTC
      categories:
        - categories
      comments_path: null
      image: null
      rss_feed_enabled: true
      json_feed_enabled: false
      feed_title: Mallow devlog
      feed_description: Progress notes from the Mallow project.
      abstract_chars_count: 300

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  # The website embeds ROADMAP.md: progress has one source of truth.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css
extra:
  generator: true
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mixutin/Mallow
      name: Mallow on GitHub
    - icon: material/rss
      link: https://mixutin.github.io/Mallow/feed_rss_created.xml
      name: Devlog RSS feed
